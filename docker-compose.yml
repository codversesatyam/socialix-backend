version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: socialix_postgres
    environment:
      POSTGRES_DB: socialix_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  #  Web UI to view tables and data in your browser
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: socialix_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@socialix.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: always

volumes:
  postgres_data: